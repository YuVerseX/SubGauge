name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Rust tooling
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Install regression browser
        run: npm exec playwright -- install chromium
      - name: Check frontend
        run: npm run build
      - name: Prepare distribution notices
        run: npm run notices
      - name: Floating layout regression (headless Chromium)
        env:
          SUBGAUGE_BROWSER_CHANNEL: chromium
        run: npm run test:layout
      - name: Detail navigation regression (headless Chromium)
        env:
          SUBGAUGE_BROWSER_CHANNEL: chromium
        run: npm run test:details
      - name: Update interaction regression (headless Chromium)
        env:
          SUBGAUGE_BROWSER_CHANNEL: chromium
        run: npm run test:updates
      - name: Update package signature regression
        run: |
          New-Item -ItemType Directory -Force -Path release/validation | Out-Null
          npm run test:update-packages | Tee-Object -FilePath release/validation/updater-package-check.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload sample browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubGauge-layout-diagnostics
          path: |
            release/validation/float-layout-browser.json
            release/validation/float-layout-*.png
            release/validation/theme-*.png
            release/validation/detail-regression.json
            release/validation/updater-regression.json
            release/validation/updater-package-check.txt
          if-no-files-found: warn
      - name: Check Rust formatting
        run: npm run fmt:rust
      - name: Check Rust lints
        run: npm run lint:rust
      - name: Rust regression tests
        run: npm run test:rust
      # Ordinary pushes and PRs never receive the production signing private key.
      - name: Prepare isolated validation-only signing identity
        run: node scripts/prepare-ci-signing.cjs --validation-only
      - name: Build validation-only signed installer
        run: npm run package
      - name: Build validation-only portable ZIP
        run: npm run package:portable
      - name: Validate update manifest with the temporary CI identity
        run: node scripts/prepare-update-manifest.cjs
      - name: Upload validation-only packages (never official releases)
        uses: actions/upload-artifact@v4
        with:
          name: SubGauge-windows-x64-validation-only
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/*.sig
            release/*.zip
            release/*.sha256
            release/update-preview.json
            release/VALIDATION-ONLY.txt
          if-no-files-found: error
          retention-days: 7
